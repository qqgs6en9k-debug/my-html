<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IA2 Lap Timer</title>

<style>

body{
    font-family:sans-serif;
    margin:10px;
    background:#f2f2f2;
}

h1{
    text-align:center;
    color:#000000;
}

#timer{
    text-align:center;
    font-size:52px;
    font-weight:bold;
    margin:10px 0 20px;
}

#lastPass{
    background:white;
    border-radius:10px;
    padding:8px;
    text-align:center;
    margin-bottom:10px;
}

#lastNumber{
    font-size:36px;
    font-weight:bold;
}

#lastName{
    font-size:36px;
    font-weight:bold;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-bottom:15px;
}

.mainBtn{
    font-size:18px;
    padding:12px 18px;
    border:none;
    border-radius:10px;
    color:white;
}

.startBtn{
    background:#28a745;
}

.stopBtn{
    background:#ff9800;
}

.resetBtn{
    background:#d32f2f;
}

.undoBtn{
    background:#607d8b;
}

.csvBtn{
    background:#1976d2;
}

.riderBtn{
    width:100%;
    height:120px;
    margin-bottom:15px;
    border:none;
    border-radius:15px;
    background:#0057b8;
    color:white;
    font-size:42px;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

thead{
    background:#efefef;
}

.riderTitle{
    font-size:26px;
    font-weight:bold;
    text-align:center;
}

.lapRow{
    display:flex;
    justify-content:space-around;
    margin-top:15px;
    font-size:18px;
    font-weight:bold;
}

.menuBtn{
    background:#444;
}

#buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

</style>
</head>
<body>

<h1>IA2</h1>

<div id="timer">00:00.000</div>

<div id="lastPass">
    <div style="font-size:14px;">
    LAST PASS
    </div>
    <span id="lastNumber">---</span>
    &nbsp;
    <span id="lastName">---</span>
</div>

<div class="controls">

    <button class="mainBtn startBtn"
        onclick="startTimer()">
        START
    </button>

    <button class="mainBtn stopBtn"
        onclick="stopTimer()">
        STOP
    </button>

    <button class="mainBtn resetBtn"
        onclick="resetTimer()">
        RESET
    </button>

    <button class="mainBtn undoBtn"
        onclick="undoLast()">
        戻す
    </button>

    <button class="mainBtn csvBtn"
        onclick="downloadCSV()">
        CSV保存
    </button>

    <button class="mainBtn menuBtn"
        onclick="location.href='index_2.html'">
        MENU
    </button>

</div>

<div id="buttons"></div>

<table>

<thead>
<tr>
    <th>Rider</th>
    <th>Lap</th>
    <th>Lap Time(s)</th>
</tr>
</thead>

<tbody id="logBody"></tbody>

</table>

<script>

/* ==================================================
   ライダー設定
   ここだけ変更すればOK
================================================== */

const riders = [

    {
        number:"51",
        name:"柳瀬",
        color:"#d60000" //YAMAHA:#0057b8, HONDA:#d60000, KAWASAKI:#00a651, SUZUKI:
    },

    {
        number:"55",
        name:"田中",
        color:"#0057b8"
    },

    {
        number:"46",
        name:"吉田",
        color:"#d60000"
    },

    {
        number:"240",
        name:"横澤",
        color:"#00a651"
    },

    {
        number:"48",
        name:"渡辺",
        color:"#0057b8"
    },

    {
        number:"122",
        name:"鴨田",
        color:"#00a651"
    },

    {
        number:"53",
        name:"福村",
        color:"#ffc20e"
    },

    {
        number:"100",
        name:"住友",
        color:"#0057b8"
    }

];

/* ================================================== */

let startTime = null;
let timerInterval = null;
let elapsedBeforeStop = 0;

const lapData = {};
const history = [];

createButtons();

function createButtons(){

    const area =
    document.getElementById("buttons");

    riders.forEach(rider=>{

        lapData[rider.number] = [];

        const btn =
        document.createElement("button");

        btn.className = "riderBtn";
        btn.style.background = "#666666";

        let pressTimer;

        btn.onclick = function(){

            recordLap(rider,btn);

        };

    btn.addEventListener(
        "touchstart",
        function(){

            pressTimer =
            setTimeout(()=>{

                showHistory(rider);

            },2000);

        }
    );

    btn.addEventListener(
        "touchend",
        function(){

            clearTimeout(
                pressTimer
            );

        }
);

        btn.innerHTML =
        `
        <div class="riderTitle">
        #${rider.number} ${rider.name}
        </div>

        <div class="lapRow">

        <span id="latest_${rider.number}">
        ---
        </span>

        <span id="best_${rider.number}">
        ---★ 
        </span>

</div>
`;

        btn.onclick = function(){

            recordLap(rider,btn);

        };

        area.appendChild(btn);

    });

}

function updateClock(ms){

    const min =
    Math.floor(ms/60000);

    const sec =
    Math.floor((ms%60000)/1000);

    const mil =
    ms%1000;

    document.getElementById("timer").innerText =
    `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}.${String(mil).padStart(3,'0')}`;

}

function startTimer(){

    if(startTime === null){

        startTime =
        Date.now() - elapsedBeforeStop;

    }

    clearInterval(timerInterval);

    timerInterval = setInterval(()=>{

        updateClock(
            Date.now()-startTime
        );

    },10);

}

function stopTimer(){

    if(startTime === null){
        return;
    }

    elapsedBeforeStop =
    Date.now()-startTime;

    clearInterval(timerInterval);

}

function resetTimer(){

    const result =
    confirm(
    "全削除しますか？"
    );

    if(!result){
        return;
    }

    clearInterval(timerInterval);

    startTime = null;
    elapsedBeforeStop = 0;

    updateClock(0);

    history.length = 0;

    Object.keys(lapData)
    .forEach(key=>{

        lapData[key] = [];

    });

    document.getElementById(
    "logBody"
    ).innerHTML = "";

    document.getElementById(
    "lastNumber"
    ).innerText = "---";

    document.getElementById(
    "lastName"
    ).innerText = "---";

    riders.forEach(rider => {

    document.getElementById(
        `latest_${rider.number}`
    ).innerText = "---";

    document.getElementById(
        `best_${rider.number}`
    ).innerText = "---★";

    const buttons =
    document.getElementsByClassName("riderBtn");

    for(let i=0;i<buttons.length;i++){

    buttons[i].style.background =
    "#666666";

    buttons[i].style.color =
    "#ffffff";

}

});

}

function recordLap(rider,btn){

    if(startTime === null){

        alert(
        "STARTを押してください"
        );

        return;

    }

    btn.style.background =
    "#ffffff";

    btn.style.color =
    "#000000";

    setTimeout(()=>{

        btn.style.background =
        rider.color;

        btn.style.color =
        "#ffffff";

    },300);

    const now =
    (Date.now()-startTime)/1000;

    const laps =
    lapData[rider.number];

    let lapTime;

    if(laps.length===0){

        lapTime = now;

    }else{

        lapTime =
        now - laps[laps.length-1].total;

    }

    laps.push({

        lap: laps.length + 1,
        lapTime: lapTime,
        total: now

    });

history.push(rider.number);

document.getElementById(
"lastNumber"
).innerText =
"#" + rider.number;

document.getElementById(
"lastName"
).innerText =
rider.name;

document.getElementById(
`latest_${rider.number}`
).innerText =
lapTime.toFixed(3)

const best =
Math.min(
    ...laps.map(x => x.lapTime)
);

document.getElementById(
`best_${rider.number}`
).innerText =
best.toFixed(3)+"★";

addLog(
    rider.number,
    laps.length,
    lapTime
);

}

function addLog(number,lap,time){

    const body =
    document.getElementById("logBody");

    const row =
    body.insertRow(0);

    row.insertCell(0).innerText =
    "#" + number;

    row.insertCell(1).innerText =
    lap;

    row.insertCell(2).innerText =
    time.toFixed(3);

}

function undoLast(){

    if(history.length===0){
        return;
    }

    const rider =
    history.pop();

    lapData[rider].pop();

    const body =
    document.getElementById("logBody");

    if(body.rows.length>0){

        body.deleteRow(0);

    }

}

function showHistory(rider){

    const laps = lapData[rider.number];

    let msg =
    `#${rider.number} ${rider.name}\n\n`;

    laps.forEach(item=>{

        msg +=
        `Lap${item.lap}  ${item.lapTime.toFixed(3)}\n`;

    });

    alert(msg);

}

function downloadCSV(){

    let csv =
    "Number,Lap,LapTime\n";

    Object.keys(lapData)
    .forEach(number=>{

        lapData[number]
        .forEach(item=>{

            csv +=
            `${number},${item.lap},${item.lapTime.toFixed(3)}\n`;

        });

    });
}

    const blob =
    new Blob(
        [csv],
        {type:"text/csv"}
    );

    const a =
    document.createElement("a");

    a.href =
    URL.createObjectURL(blob);

    a.download =
    "ia1_yamaha.csv";

    a.click();

}

</script>

</body>
</html>
